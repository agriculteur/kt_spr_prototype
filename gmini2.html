<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RegulTrack Pro | Tracé Automatique</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .active-nav { background: #0ea5e9; color: white !important; }
        .form-section { border-left: 4px solid #e2e8f0; padding-left: 1.5rem; margin-bottom: 2rem; }
        .read-only-badge { background: #f1f5f9; color: #64748b; padding: 2px 8px; border-radius: 6px; font-size: 10px; font-weight: 800; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">

    <div id="toast-container" class="fixed top-5 right-5 z-[100] space-y-3"></div>

    <aside id="sidebar" class="fixed inset-y-0 left-0 z-50 w-64 bg-slate-900 text-white transition-transform md:translate-x-0 -translate-x-full">
        <div class="flex flex-col h-full p-6">
            <div class="flex items-center space-x-3 mb-10">
                <div class="w-8 h-8 bg-sky-500 rounded-lg flex items-center justify-center shadow-lg">
                    <i class="fas fa-clock-rotate-left text-white text-sm"></i>
                </div>
                <span class="text-lg font-bold">RegulTrack <span class="text-sky-400">Pro</span></span>
            </div>

            <nav class="flex-1 space-y-2">
                <button onclick="navigate('dashboard')" id="nav-dashboard" class="flex items-center w-full p-3 rounded-xl text-slate-400 hover:text-white hover:bg-slate-800 transition-all">
                    <i class="fas fa-chart-line w-6 mr-2"></i> Dashboard
                </button>
                <button onclick="navigate('projects')" id="nav-projects" class="flex items-center w-full p-3 rounded-xl text-slate-400 hover:text-white hover:bg-slate-800 transition-all">
                    <i class="fas fa-list w-6 mr-2"></i> Portefeuille
                </button>
                <button onclick="navigate('create')" id="nav-create" class="flex items-center w-full p-3 rounded-xl text-slate-400 hover:text-white hover:bg-slate-800 transition-all">
                    <i class="fas fa-plus-circle w-6 mr-2"></i> Nouveau Projet
                </button>
            </nav>
        </div>
    </aside>

    <div class="md:ml-64 min-h-screen flex flex-col">
        <header class="h-16 bg-white border-b border-slate-200 px-8 flex items-center justify-between sticky top-0 z-40">
            <div id="breadcrumb" class="text-xs font-bold text-slate-400 uppercase tracking-widest">Navigation</div>
            <div class="flex items-center space-x-4">
                <input type="text" id="globalSearch" onkeyup="filterProjects()" placeholder="Rechercher un projet..." class="bg-slate-100 border-none rounded-lg px-4 py-1.5 text-sm focus:ring-2 focus:ring-sky-500 outline-none w-64">
            </div>
        </header>

        <main id="app-container" class="p-8 max-w-6xl mx-auto w-full">
            </main>
    </div>

    <script>
        /* ==========================================
           1. LOGIQUE DE DONNÉES & HORODATAGE
        ========================================== */
        let projects = JSON.parse(localStorage.getItem('app_projects')) || [];

        const EMPTY_PROJECT = () => ({
            code: Date.now(),
            date_creation: null,      // Champ auto
            date_modification: null,  // Champ auto
            titre: "", type_projet: "", reglement: "", statut: "en cours", priorite: "moyen",
            loi: [], niveau_risque: "moyen", juridiction_principale: "", direction_principale: "",
            direction_responsable: [], Ressources_associees: [], soutien_juridique: [],
            Comite_ACVM: [], groupe_de_travail: [], description: "", enjeux: "", discussion: "",
            developpements_significatifs: [], rencontres_approbations: [], jalons: [],
            impact_système: false, impact_description: "", documents: [], media: []
        });

        function saveToStorage() {
            localStorage.setItem('app_projects', JSON.stringify(projects));
        }

        function formatDate(isoString) {
            if (!isoString) return "N/A";
            return new Date(isoString).toLocaleString('fr-FR', {
                day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit'
            });
        }

        /* ==========================================
           2. ROUTAGE
        ========================================== */
        function navigate(view, params = null) {
            const container = document.getElementById('app-container');
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('active-nav'));
            const activeBtn = document.getElementById(`nav-${view}`);
            if (activeBtn) activeBtn.classList.add('active-nav');

            if (view === 'dashboard') container.innerHTML = renderDashboard();
            if (view === 'projects') container.innerHTML = renderProjectList();
            if (view === 'detail') container.innerHTML = renderProjectDetail(params);
            if (view === 'create') container.innerHTML = renderForm();
            if (view === 'edit') container.innerHTML = renderForm(params);
            
            document.getElementById('breadcrumb').innerText = view.replace('create', 'Nouveau').replace('edit', 'Édition');
            window.scrollTo(0,0);
        }

        /* ==========================================
           3. VUES (LISTE & DASHBOARD)
        ========================================== */
        function renderDashboard() {
            return `
                <div class="mb-10">
                    <h1 class="text-4xl font-black mb-2">Tableau de Bord</h1>
                    <p class="text-slate-500">Statistiques et traçabilité du portefeuille.</p>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div class="bg-white p-8 rounded-3xl shadow-sm border border-slate-200">
                        <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">Projets Totaux</p>
                        <p class="text-4xl font-black text-slate-900">${projects.length}</p>
                    </div>
                </div>
            `;
        }

        function renderProjectList() {
            return `
                <div class="flex justify-between items-center mb-8">
                    <h1 class="text-3xl font-black">Portefeuille</h1>
                    <button onclick="navigate('create')" class="bg-sky-500 text-white px-6 py-3 rounded-2xl font-bold text-sm shadow-lg hover:bg-sky-600 transition">
                        <i class="fas fa-plus mr-2"></i>Nouveau Projet
                    </button>
                </div>
                <div id="projectGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    ${projects.map(p => `
                        <div onclick="navigate('detail', ${p.code})" class="bg-white p-6 rounded-3xl border border-slate-200 hover:shadow-xl hover:border-sky-300 transition-all cursor-pointer group">
                            <div class="flex justify-between items-start mb-4">
                                <span class="text-[10px] font-black text-slate-400">#${p.code}</span>
                                <span class="px-2 py-1 rounded-lg text-[9px] font-black uppercase bg-slate-100 text-slate-600">${p.statut}</span>
                            </div>
                            <h3 class="font-bold text-lg text-slate-800 group-hover:text-sky-600 mb-2 line-clamp-1">${p.titre || 'Sans titre'}</h3>
                            <p class="text-xs text-slate-500 line-clamp-2 mb-4 h-8">${p.description || 'Pas de description'}</p>
                            <div class="pt-4 border-t border-slate-50 flex flex-col space-y-1">
                                <p class="text-[9px] text-slate-400 font-bold uppercase">Modifié le: ${formatDate(p.date_modification)}</p>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        /* ==========================================
           4. FORMULAIRE CRUD COMPLET + AUTO-FIELDS
        ========================================== */
        function renderForm(code = null) {
            const isEdit = code !== null;
            const p = isEdit ? projects.find(x => x.code === code) : EMPTY_PROJECT();

            return `
                <form onsubmit="handleFormSubmit(event, ${isEdit ? code : null})" class="space-y-8 animate-in fade-in duration-300">
                    <div class="flex justify-between items-center bg-white p-6 rounded-3xl border border-slate-200 shadow-sm sticky top-20 z-30">
                        <div>
                            <h1 class="text-2xl font-black">${isEdit ? 'Modifier' : 'Créer'} le Projet</h1>
                            <div class="flex space-x-4 mt-1">
                                <span class="text-[10px] font-bold text-slate-400 uppercase">Création: ${formatDate(p.date_creation)}</span>
                                <span class="text-[10px] font-bold text-slate-400 uppercase">Modification: ${formatDate(p.date_modification)}</span>
                            </div>
                        </div>
                        <div class="flex items-center space-x-3">
                            <button type="button" onclick="navigate('projects')" class="text-slate-400 font-black text-xs uppercase px-4">Annuler</button>
                            <button type="submit" class="bg-emerald-500 text-white px-8 py-3 rounded-2xl font-black text-xs uppercase shadow-lg hover:bg-emerald-600 transition">Enregistrer les données</button>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                        <div class="space-y-6">
                            <div class="bg-white p-8 rounded-3xl border border-slate-200 shadow-sm">
                                <h3 class="text-sky-600 font-black text-[10px] uppercase mb-6 tracking-widest">1. Informations de Base</h3>
                                <div class="space-y-4">
                                    <div>
                                        <label class="block text-[10px] font-black uppercase text-slate-400 mb-1">Titre Officiel</label>
                                        <input type="text" id="f-titre" value="${p.titre}" class="w-full p-3 bg-slate-50 border-0 rounded-xl font-bold" required>
                                    </div>
                                    <div class="grid grid-cols-2 gap-4">
                                        <div>
                                            <label class="block text-[10px] font-black uppercase text-slate-400 mb-1">Type</label>
                                            <input type="text" id="f-type_projet" value="${p.type_projet}" class="w-full p-3 bg-slate-50 border-0 rounded-xl text-sm">
                                        </div>
                                        <div>
                                            <label class="block text-[10px] font-black uppercase text-slate-400 mb-1">Règlement</label>
                                            <input type="text" id="f-reglement" value="${p.reglement}" class="w-full p-3 bg-slate-50 border-0 rounded-xl text-sm">
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="bg-white p-8 rounded-3xl border border-slate-200 shadow-sm">
                                <h3 class="text-sky-600 font-black text-[10px] uppercase mb-6 tracking-widest">2. Pilotage & Risques</h3>
                                <div class="grid grid-cols-3 gap-4">
                                    <div>
                                        <label class="block text-[10px] font-black uppercase text-slate-400 mb-1">Statut</label>
                                        <select id="f-statut" class="w-full p-3 bg-slate-50 border-0 rounded-xl text-xs font-bold">
                                            <option ${p.statut === 'en cours' ? 'selected' : ''}>en cours</option>
                                            <option ${p.statut === 'terminé' ? 'selected' : ''}>terminé</option>
                                            <option ${p.statut === 'en attente' ? 'selected' : ''}>en attente</option>
                                            <option ${p.statut === 'clos' ? 'selected' : ''}>clos</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label class="block text-[10px] font-black uppercase text-slate-400 mb-1">Priorité</label>
                                        <select id="f-priorite" class="w-full p-3 bg-slate-50 border-0 rounded-xl text-xs font-bold">
                                            <option ${p.priorite === 'faible' ? 'selected' : ''}>faible</option>
                                            <option ${p.priorite === 'moyen' ? 'selected' : ''}>moyen</option>
                                            <option ${p.priorite === 'élevé' ? 'selected' : ''}>élevé</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label class="block text-[10px] font-black uppercase text-slate-400 mb-1">Risque</label>
                                        <select id="f-niveau_risque" class="w-full p-3 bg-slate-50 border-0 rounded-xl text-xs font-bold">
                                            <option ${p.niveau_risque === 'faible' ? 'selected' : ''}>faible</option>
                                            <option ${p.niveau_risque === 'moyen' ? 'selected' : ''}>moyen</option>
                                            <option ${p.niveau_risque === 'élevé' ? 'selected' : ''}>élevé</option>
                                        </select>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="space-y-6">
                            <div class="bg-white p-8 rounded-3xl border border-slate-200 shadow-sm">
                                <h3 class="text-sky-600 font-black text-[10px] uppercase mb-6 tracking-widest">3. Description & Enjeux</h3>
                                <div class="space-y-4">
                                    <textarea id="f-description" placeholder="Description détaillée..." class="w-full p-4 bg-slate-50 border-0 rounded-2xl h-32 text-sm">${p.description}</textarea>
                                    <div class="grid grid-cols-2 gap-4">
                                        <textarea id="f-enjeux" placeholder="Enjeux..." class="w-full p-3 bg-slate-50 border-0 rounded-xl text-xs h-20">${p.enjeux}</textarea>
                                        <textarea id="f-discussion" placeholder="Points de discussion..." class="w-full p-3 bg-slate-50 border-0 rounded-xl text-xs h-20">${p.discussion}</textarea>
                                    </div>
                                </div>
                            </div>

                            <div class="bg-slate-900 p-8 rounded-3xl shadow-xl text-white">
                                <h3 class="text-sky-400 font-black text-[10px] uppercase mb-6 tracking-widest">4. Données de Structure (Schéma JSON)</h3>
                                <div class="space-y-4">
                                    <div>
                                        <label class="block text-[9px] font-bold text-slate-500 uppercase mb-1">Ressources (JSON)</label>
                                        <textarea id="f-Ressources_associees" class="w-full p-3 bg-slate-800 border-0 rounded-xl h-20 text-[10px] font-mono">${JSON.stringify(p.Ressources_associees || [])}</textarea>
                                    </div>
                                    <div>
                                        <label class="block text-[9px] font-bold text-slate-500 uppercase mb-1">Jalons (JSON)</label>
                                        <textarea id="f-jalons" class="w-full p-3 bg-slate-800 border-0 rounded-xl h-20 text-[10px] font-mono">${JSON.stringify(p.jalons || [])}</textarea>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </form>
            `;
        }

        /* ==========================================
           5. SAUVEGARDE ET AUTO-STAMP
        ========================================== */
        function handleFormSubmit(e, code) {
            e.preventDefault();
            const now = new Date().toISOString();
            
            try {
                const isNew = code === null;
                const existing = isNew ? EMPTY_PROJECT() : projects.find(p => p.code === code);

                const updatedProject = {
                    ...existing,
                    code: code || Date.now(),
                    
                    // --- AUTOMATISATION DES DATES ---
                    date_creation: isNew ? now : existing.date_creation, // Fixe si création
                    date_modification: now,                             // Toujours mis à jour
                    
                    titre: document.getElementById('f-titre').value,
                    type_projet: document.getElementById('f-type_projet').value,
                    reglement: document.getElementById('f-reglement').value,
                    statut: document.getElementById('f-statut').value,
                    priorite: document.getElementById('f-priorite').value,
                    niveau_risque: document.getElementById('f-niveau_risque').value,
                    description: document.getElementById('f-description').value,
                    enjeux: document.getElementById('f-enjeux').value,
                    discussion: document.getElementById('f-discussion').value,
                    Ressources_associees: JSON.parse(document.getElementById('f-Ressources_associees').value),
                    jalons: JSON.parse(document.getElementById('f-jalons').value),
                };

                if (isNew) {
                    projects.unshift(updatedProject);
                    showToast("Projet créé avec succès !");
                } else {
                    const idx = projects.findIndex(p => p.code === code);
                    projects[idx] = updatedProject;
                    showToast("Mise à jour effectuée.");
                }

                saveToStorage();
                navigate('detail', updatedProject.code);
            } catch (err) {
                alert("Erreur de format JSON dans les listes complexes : " + err.message);
            }
        }

        /* ==========================================
           6. VUE DÉTAIL (AFFICHAGE DES CLÉS)
        ========================================== */
        function renderProjectDetail(code) {
            const p = projects.find(x => x.code === code);
            if (!p) return "<p>Erreur : Projet non trouvé.</p>";

            return `
                <div class="flex flex-col md:flex-row justify-between items-start gap-4 mb-8">
                    <div>
                        <button onclick="navigate('projects')" class="text-xs font-bold text-sky-500 mb-2 flex items-center">
                            <i class="fas fa-arrow-left mr-2"></i> RETOUR LISTE
                        </button>
                        <h1 class="text-3xl font-black text-slate-900">${p.titre || 'Sans Titre'}</h1>
                        <div class="flex items-center space-x-3 mt-2">
                            <span class="read-only-badge">Créé le : ${formatDate(p.date_creation)}</span>
                            <span class="read-only-badge">Dernière modif. : ${formatDate(p.date_modification)}</span>
                        </div>
                    </div>
                    <button onclick="navigate('edit', ${p.code})" class="bg-slate-900 text-white px-8 py-3 rounded-2xl font-black text-xs uppercase shadow-xl hover:bg-slate-800 transition">
                        <i class="fas fa-edit mr-2"></i> Modifier la fiche
                    </button>
                </div>

                <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                    <div class="lg:col-span-2 space-y-6">
                        <div class="bg-white p-8 rounded-3xl border border-slate-200 shadow-sm">
                            <h3 class="text-[10px] font-black uppercase text-slate-400 mb-4 tracking-widest">Contenu du dossier</h3>
                            <p class="text-slate-700 leading-relaxed text-lg mb-6">${p.description || 'Aucune description fournie.'}</p>
                            <div class="grid grid-cols-2 gap-6 p-6 bg-slate-50 rounded-2xl">
                                <div><p class="text-[10px] font-black text-slate-400 uppercase mb-1">Enjeux</p><p class="text-sm font-medium">${p.enjeux || 'N/A'}</p></div>
                                <div><p class="text-[10px] font-black text-slate-400 uppercase mb-1">Discussion</p><p class="text-sm font-medium">${p.discussion || 'N/A'}</p></div>
                            </div>
                        </div>
                    </div>

                    <div class="space-y-6">
                        <div class="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm">
                            <h3 class="text-[10px] font-black uppercase text-slate-400 mb-4 tracking-widest">Métadonnées</h3>
                            <div class="space-y-3">
                                <div class="flex justify-between text-xs"><span>Code Système</span><b class="font-black">${p.code}</b></div>
                                <div class="flex justify-between text-xs"><span>Règlement</span><b class="font-black text-sky-600">${p.reglement || 'N/A'}</b></div>
                                <div class="flex justify-between text-xs"><span>Priorité</span><b class="font-black uppercase ${p.priorite === 'élevé' ? 'text-rose-500' : 'text-slate-900'}">${p.priorite}</b></div>
                                <div class="flex justify-between text-xs"><span>Risque</span><b class="font-black uppercase">${p.niveau_risque}</b></div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        /* HELPERS */
        function showToast(m) {
            const t = document.createElement('div');
            t.className = "bg-slate-900 text-white px-6 py-3 rounded-2xl shadow-2xl font-bold text-xs uppercase animate-bounce";
            t.innerText = m;
            document.getElementById('toast-container').appendChild(t);
            setTimeout(() => t.remove(), 3000);
        }

        function filterProjects() {
            const q = document.getElementById('globalSearch').value.toLowerCase();
            const grid = document.getElementById('projectGrid');
            const filtered = projects.filter(p => p.titre.toLowerCase().includes(q) || p.code.toString().includes(q));
            // Redessiner uniquement le grid
            grid.innerHTML = filtered.map(p => `
                <div onclick="navigate('detail', ${p.code})" class="bg-white p-6 rounded-3xl border border-slate-200 hover:shadow-xl transition-all cursor-pointer group">
                    <h3 class="font-bold text-slate-800 group-hover:text-sky-600 mb-2">${p.titre}</h3>
                    <p class="text-[9px] text-slate-400 font-bold uppercase">Modifié le: ${formatDate(p.date_modification)}</p>
                </div>
            `).join('');
        }

        /* INITIALISATION */
        navigate('dashboard');
    </script>
</body>
</html>
