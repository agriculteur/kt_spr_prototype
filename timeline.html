<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SPR Pro | Timeline</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300;0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700;0,14..32,800;1,14..32,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      corePlugins: { preflight: false }, /* don't let Tailwind reset override existing styles */
      theme: {
        extend: {
          fontFamily: {
            mono: ['"JetBrains Mono"', '"Fira Code"', 'monospace'],
          }
        }
      }
    }
  </script>
  <style>
    /* ── Variables ────────────────────────────────────── */
    :root {
      --bg:        #f0f4f9;
      --surface:   #ffffff;
      --border:    #e2e8f0;
      --accent:    #0ea5e9;
      --accent2:   #6366f1;
      --danger:    #ef4444;
      --success:   #22c55e;
      --warn:      #f59e0b;
      --text:      #0f172a;
      --text-2:    #334155;
      --muted:     #64748b;
      --radius:    12px;
      --shadow:    0 4px 24px rgba(0,0,0,.07);
      --shadow-lg: 0 8px 40px rgba(0,0,0,.12);
      /* geometry — shrink on narrow viewports */
      --line:      clamp(2px,  .4vw, 3px);
      --dot:       clamp(14px, 2vw,  20px);
      --tl-indent: clamp(36px, 6vw,  60px); /* margin-left of cards & caps */
      --tl-axis:   clamp(18px, 3vw,  28px); /* left of the axis line inside wrapper */
      --font-body: 'Inter', system-ui, -apple-system, sans-serif;
      --font-mono: 'JetBrains Mono', 'Fira Code', monospace;
      /* fluid type scale: min @ ~320px → max @ ~1280px */
      --text-xs:   clamp(.6rem,   .5rem + .5vw,  .75rem);
      --text-sm:   clamp(.7rem,   .55rem + .6vw, .875rem);
      --text-base: clamp(.8rem,   .6rem  + .75vw, 1rem);
      --text-lg:   clamp(.9rem,   .65rem + .9vw,  1.125rem);
      --text-xl:   clamp(1rem,    .7rem  + 1.1vw, 1.35rem);
      --lh-tight:  1.3;
      --lh-snug:   1.45;
      --lh-normal: 1.6;
      --ls-wide:   .05em;
      --ls-wider:  .08em;
    }

    /* ── Reset / Base ─────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-body);
      font-size: var(--text-base);
      line-height: var(--lh-normal);
      font-feature-settings: 'kern' 1, 'liga' 1, 'calt' 1, 'ss01' 1;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }
    a { color: inherit; text-decoration: none; }
    button { cursor: pointer; font-family: inherit; }
    input, textarea, select { font-family: inherit; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }

    /* ── App header ───────────────────────────────────── */
    .app-header {
      position: sticky; top: 0; z-index: 100;
      background: rgba(255,255,255,.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      height: 62px;
      display: flex; align-items: center; justify-content: space-between;
      box-shadow: 0 2px 12px rgba(0,0,0,.06);
    }
    .app-header h1 {
      font-size: var(--text-lg); font-weight: 800;
      letter-spacing: -.02em; line-height: var(--lh-tight);
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      display: flex; align-items: center; gap: 10px;
    }

    /* ── Timeline host (the element you pass as container) */
    .tl-host { margin-bottom: 60px; }

    /* ── Timeline panel header ────────────────────────── */
    .tl-panel-header {
      display: flex; flex-wrap: wrap; gap: 10px;
      align-items: center; justify-content: space-between;
      padding: 18px 0 14px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 20px;
    }
    .tl-panel-title {
      font-size: var(--text-lg); font-weight: 800;
      letter-spacing: -.02em;
      display: flex; align-items: center; gap: 8px;
    }
    .tl-panel-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

    /* ── Buttons ──────────────────────────────────────── */
    .btn {
      display: inline-flex; align-items: center; gap: 7px;
      padding: 8px 16px; border-radius: 8px; font-size: var(--text-sm);
      font-weight: 600; letter-spacing: .01em; border: none; transition: all .18s;
      white-space: nowrap;
    }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: #0284c7; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(14,165,233,.35); }
    .btn-secondary { background: var(--accent2); color: #fff; }
    .btn-secondary:hover { background: #4f46e5; transform: translateY(-1px); }
    .btn-ghost { background: transparent; color: var(--muted); border: 1.5px solid var(--border); }
    .btn-ghost:hover { background: var(--border); color: var(--text); }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-danger:hover { background: #dc2626; }
    .btn-sm { padding: 5px 10px; font-size: .78rem; border-radius: 6px; }
    .btn-icon { padding: 7px; border-radius: 8px; }

    /* ── Search ───────────────────────────────────────── */
    .search-box { position: relative; display: flex; align-items: center; }
    .search-box i { position: absolute; left: 10px; color: var(--muted); font-size: .8rem; }
    .search-box input {
      padding: 8px 12px 8px 30px; border: 1.5px solid var(--border); border-radius: 8px;
      font-size: .85rem; width: 200px; background: var(--surface);
      transition: all .2s; outline: none;
    }
    .search-box input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(14,165,233,.12); width: 250px; }

    /* ── Toolbar (embedded in cap-start, right edge) ─── */
    .cap-toolbar {
      position: absolute; right: 0; top: 50%; transform: translateY(-50%);
      display: flex; align-items: center; gap: 4px; z-index: 10;
    }
    .toolbar-toggle {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 3px 9px; border-radius: 20px; border: 1.5px solid var(--border);
      background: var(--surface); color: var(--muted); cursor: pointer;
      font-size: var(--text-xs); font-weight: 700; letter-spacing: .04em;
      text-transform: uppercase; transition: all .15s; user-select: none;
    }
    .toolbar-toggle:hover { border-color: var(--accent); color: var(--accent); }
    .toolbar-toggle .t-chevron { transition: transform .2s; }
    .toolbar-toggle.open .t-chevron { transform: rotate(180deg); }
    .toolbar-controls {
      display: none; align-items: center; gap: 4px;
      position: absolute; right: 0; top: calc(100% + 6px);
      background: var(--surface); border: 1.5px solid var(--border);
      border-radius: var(--radius); padding: 6px 8px; box-shadow: 0 4px 16px rgba(0,0,0,.12);
      white-space: nowrap; z-index: 20;
    }
    .toolbar-controls.open { display: flex; }

    /* ── Timeline wrapper ─────────────────────────────── */
    .timeline-wrapper { position: relative; }
    .timeline-wrapper::before {
      content: '';
      position: absolute; left: var(--tl-axis); top: 0; bottom: 0;
      width: var(--line);
      background: linear-gradient(to bottom, var(--accent), var(--accent2));
      border-radius: 10px;
    }

    /* ── Timeline cap nodes ───────────────────────────── */
    .timeline-cap {
      position: relative; margin-left: var(--tl-indent);
      display: flex; align-items: center; gap: 12px; height: 36px;
    }
    .timeline-cap::before {
      content: '';
      position: absolute;
      left: calc(-1 * var(--tl-indent) + var(--tl-axis) - 11px + var(--line) / 2);
      width: 22px; height: 22px; border-radius: 50%;
      border: 3px solid var(--surface); z-index: 1;
    }
    .timeline-cap.cap-start { margin-bottom: 8px; }
    .timeline-cap.cap-end   { margin-top: 8px; }
    .timeline-cap.cap-start::before { background: var(--accent); box-shadow: 0 0 0 3px var(--accent), 0 0 12px rgba(14,165,233,.4); }
    .timeline-cap.cap-end::before   { background: var(--accent2); box-shadow: 0 0 0 3px var(--accent2), 0 0 12px rgba(99,102,241,.4); }
    .cap-label { font-size: var(--text-xs); font-weight: 800; letter-spacing: var(--ls-wider); text-transform: uppercase; opacity: .5; }
    .cap-start .cap-label { color: var(--accent); }
    .cap-end   .cap-label { color: var(--accent2); }

    /* ── Event card ───────────────────────────────────── */
    .event-card {
      position: relative; margin-left: var(--tl-indent); margin-bottom: clamp(12px, 2vw, 20px);
      background: var(--surface); border-radius: var(--radius);
      box-shadow: var(--shadow); border: 1.5px solid var(--border);
      transition: box-shadow .2s, transform .2s;
      animation: slideIn .3s ease;
    }
    .event-card:hover { box-shadow: var(--shadow-lg); transform: translateX(2px); }
    .event-card::before {
      content: '';
      position: absolute;
      left: calc(-1 * var(--tl-indent) + var(--tl-axis) - var(--dot) / 2 + var(--line) / 2);
      top: 22px; width: var(--dot); height: var(--dot);
      border-radius: 50%; border: 3px solid var(--surface);
      box-shadow: 0 0 0 2px var(--accent);
      background: var(--accent); z-index: 1; transition: background .2s;
    }
    .event-card.overdue::before  { background: var(--danger); box-shadow: 0 0 0 2px var(--danger); }
    .event-card.on-time::before  { background: var(--success); box-shadow: 0 0 0 2px var(--success); }

    /* clickable overlay on the timeline dot */
    .event-dot {
      position: absolute;
      left: calc(-1 * var(--tl-indent) + var(--tl-axis) - var(--dot) / 2 + var(--line) / 2);
      top: 22px; width: var(--dot); height: var(--dot);
      border-radius: 50%; z-index: 2;
      cursor: pointer;
      transition: transform .18s;
    }
    .event-dot:hover { transform: scale(1.35); }
    .event-dot.has-subs { cursor: pointer; }

    .event-header {
      display: flex; align-items: flex-start; justify-content: space-between;
      padding: clamp(10px, 1.5vw, 16px) clamp(12px, 2vw, 18px) clamp(8px, 1.2vw, 12px); gap: 12px;
    }
    .event-header-left { flex: 1; min-width: 0; }
    .event-actions { display: flex; gap: 6px; flex-shrink: 0; }

    /* ── Sub-events ───────────────────────────────────── */
    .sub-toggle {
      display: flex; align-items: center; gap: 8px; padding: 10px 20px;
      border-top: 1px solid var(--border);
      font-size: var(--text-xs); font-weight: 700;
      letter-spacing: var(--ls-wide); text-transform: uppercase; color: var(--muted);
      cursor: pointer; user-select: none; transition: background .15s;
      border-radius: 0 0 var(--radius) var(--radius);
    }
    .sub-toggle:hover { background: #f8fafc; }
    .sub-toggle .count-badge {
      background: var(--accent); color: #fff;
      font-size: var(--text-xs); font-weight: 700;
      padding: 1px 8px; border-radius: 10px; letter-spacing: 0; text-transform: none;
    }
    .sub-toggle .chevron { margin-left: auto; transition: transform .2s; }
    .sub-toggle.open .chevron { transform: rotate(180deg); }

    .sub-list {
      overflow: hidden; max-height: 0;
      transition: max-height .35s cubic-bezier(0.4,0,0.2,1);
      background: #f8fafc;
      border-radius: 0 0 var(--radius) var(--radius);
      position: relative;
    }
    .sub-list.open { max-height: 2000px; }

    /* vertical connector line inside the sub-list */
    .sub-list::before {
      content: '';
      position: absolute;
      left: var(--tl-axis); top: 0; bottom: 0;
      width: 2px;
      background: linear-gradient(to bottom, var(--accent2), rgba(99,102,241,.15));
      border-radius: 10px;
      pointer-events: none;
    }

    .sub-item {
      display: flex; align-items: center; gap: 12px;
      padding: clamp(8px, 1.2vw, 11px) clamp(14px, 2vw, 18px) clamp(8px, 1.2vw, 11px) calc(var(--tl-axis) + 24px);
      border-top: 1px solid var(--border);
      transition: background .15s; animation: slideIn .2s ease;
      position: relative;
    }
    .sub-item:hover { background: #f0f4f9; }

    /* dot on the sub connector line */
    .sub-item::before {
      content: '';
      position: absolute;
      left: calc(var(--tl-axis) - 4px); /* centre on the 2px line */
      top: 50%; transform: translateY(-50%);
      width: clamp(7px, 1.2vw, 10px); height: clamp(7px, 1.2vw, 10px);
      border-radius: 50%;
      border: 2px solid #f8fafc;
      background: #94a3b8; /* default s1 */
      z-index: 1;
    }
    .sub-item.s2::before { background: var(--warn); }
    .sub-item.s3::before { background: var(--accent); }
    .sub-item.s4::before { background: var(--success); }
    .sub-item.sr::before { background: var(--danger); }

    /* right-edge status band */
    .sub-item::after {
      content: '';
      position: absolute;
      right: 0; top: 0; bottom: 0;
      width: clamp(5px, 1vw, 12px);
      background: #94a3b8; /* default s1 */
    }
    .sub-item:last-child::after { border-radius: 0 0 var(--radius) 0; }
    .sub-item.s2::after { background: var(--warn); }
    .sub-item.s3::after { background: var(--accent); }
    .sub-item.s4::after { background: var(--success); }
    .sub-item.sr::after { background: var(--danger); }

    .add-sub-row {
      position: relative;
      padding: 10px 10px 10px calc(var(--tl-axis) + 24px);
      border-top: 1px solid var(--border);
    }
    .add-sub-row::before {
      content: '';
      position: absolute;
      left: calc(var(--tl-axis) - 3px);
      top: 50%; transform: translateY(-50%);
      width: 8px; height: 8px;
      border-radius: 50%;
      border: 2px solid #f8fafc;
      background: rgba(99,102,241,.3);
      z-index: 1;
    }

    .status-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .status-dot.s1 { background: #94a3b8; }
    .status-dot.s2 { background: var(--warn); }
    .status-dot.s3 { background: var(--accent); }
    .status-dot.s4 { background: var(--success); }

    .sub-info { flex: 1; min-width: 0; }
    .status-dot.sr { background: var(--danger); }

    .sub-actions { display: flex; gap: 4px; flex-shrink: 0; }

    /* ── Attachment chips ─────────────────────────────── */
    .attach-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
    .attach-chip {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 3px 9px 3px 7px; border-radius: 20px;
      font-size: var(--text-xs); font-weight: 600;
      border: 1.5px solid var(--border); background: var(--surface);
      color: var(--text-2); text-decoration: none;
      transition: background .15s, border-color .15s;
      cursor: pointer; max-width: 220px;
    }
    .attach-chip:hover { background: #f0f4f9; border-color: var(--accent); color: var(--accent); }
    .attach-chip i { font-size: .72rem; flex-shrink: 0; }
    .attach-chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* ── Attachment modal section ─────────────────────── */
    .attach-tab-bar {
      display: flex; gap: 0; border: 1.5px solid var(--border); border-radius: 8px;
      overflow: hidden; margin-bottom: 14px;
    }
    .attach-tab {
      flex: 1; padding: 7px; font-size: var(--text-xs); font-weight: 700;
      text-align: center; cursor: pointer; background: var(--surface);
      color: var(--muted); border: none; transition: background .15s, color .15s;
      letter-spacing: .03em; text-transform: uppercase;
    }
    .attach-tab.active { background: var(--accent); color: #fff; }
    .attach-tab-panel { display: none; }
    .attach-tab-panel.active { display: block; }

    .attach-pending-list { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
    .attach-pending-item {
      display: flex; align-items: center; gap: 8px;
      padding: 6px 10px; border-radius: 8px;
      background: #f8fafc; border: 1.5px solid var(--border);
      font-size: var(--text-xs);
    }
    .attach-pending-item span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .attach-pending-item button {
      background: none; border: none; color: var(--danger);
      cursor: pointer; font-size: .8rem; padding: 0 2px; flex-shrink: 0;
    }

    /* ── Empty state ──────────────────────────────────── */
    .empty-state { text-align: center; padding: 80px 20px; color: var(--muted); }
    .empty-state i { font-size: 3rem; margin-bottom: 16px; opacity: .4; }
    .empty-state p { font-size: .95rem; margin-bottom: 20px; }

    /* ── Modal ────────────────────────────────────────── */
    .modal-overlay {
      position: fixed; inset: 0; z-index: 1000;
      background: rgba(15,23,42,.45); backdrop-filter: blur(4px);
      display: flex; align-items: center; justify-content: center; padding: 20px;
      opacity: 0; pointer-events: none; transition: opacity .22s;
    }
    .modal-overlay.active { opacity: 1; pointer-events: all; }
    .modal {
      background: var(--surface); border-radius: 16px; box-shadow: var(--shadow-lg);
      width: 100%; max-width: 520px; max-height: 90vh; overflow-y: auto;
      transform: scale(.95) translateY(12px);
      transition: transform .25s cubic-bezier(.34,1.56,.64,1);
    }
    .modal-overlay.active .modal { transform: scale(1) translateY(0); }
    .modal-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 20px 24px 16px; border-bottom: 1px solid var(--border);
    }
    .modal-header h2 { font-size: var(--text-base); font-weight: 700; letter-spacing: -.02em; }
    .modal-close {
      width: 32px; height: 32px; border-radius: 8px; border: none;
      background: #f1f5f9; color: var(--muted); font-size: .9rem;
      display: flex; align-items: center; justify-content: center; transition: all .15s;
    }
    .modal-close:hover { background: #fee2e2; color: var(--danger); }
    .modal-body { padding: 20px 24px; }
    .modal-footer {
      padding: 16px 24px; border-top: 1px solid var(--border);
      display: flex; gap: 8px; justify-content: flex-end;
    }

    /* ── Form ─────────────────────────────────────────── */
    .form-group { margin-bottom: 18px; }
    .form-label {
      display: block; font-size: var(--text-xs); font-weight: 700;
      color: var(--muted); margin-bottom: 6px;
      text-transform: uppercase; letter-spacing: var(--ls-wider);
    }
    .form-control {
      width: 100%; padding: 9px 13px; border: 1.5px solid var(--border); border-radius: 8px;
      font-size: var(--text-sm); line-height: var(--lh-snug);
      background: var(--surface); color: var(--text); outline: none;
      transition: border-color .18s, box-shadow .18s;
    }
    .form-control:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(14,165,233,.12); }
    textarea.form-control { resize: vertical; min-height: 80px; line-height: var(--lh-normal); }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    /* ── Confirm dialog ───────────────────────────────── */
    .confirm-modal { max-width: 380px; }
    .confirm-modal .modal-body { text-align: center; padding: 28px 24px 20px; }
    .confirm-modal .confirm-icon { font-size: 2.2rem; color: var(--danger); margin-bottom: 14px; }
    .confirm-modal p { color: var(--muted); font-size: var(--text-sm); line-height: var(--lh-normal); }

    /* ── Toast ────────────────────────────────────────── */
    .toast-container {
      position: fixed; bottom: 24px; right: 24px; z-index: 2000;
      display: flex; flex-direction: column; gap: 8px; pointer-events: none;
    }
    .toast {
      background: #1e293b; color: #fff;
      padding: 11px 18px; border-radius: 10px;
      font-size: var(--text-sm); font-weight: 500; letter-spacing: .01em;
      box-shadow: var(--shadow-lg); display: flex; align-items: center; gap: 10px;
      animation: toastIn .3s ease, toastOut .3s ease 2.5s forwards;
      pointer-events: all;
    }
    .toast.success { background: #15803d; }
    .toast.error   { background: #b91c1c; }

    /* ── Animations ───────────────────────────────────── */
    @keyframes slideIn  { from { opacity:0; transform: translateY(-8px); } to { opacity:1; transform: translateY(0); } }
    @keyframes toastIn  { from { opacity:0; transform: translateY(12px); } to { opacity:1; transform: translateY(0); } }
    @keyframes toastOut { from { opacity:1; } to { opacity:0; transform: translateY(8px); } }
    @keyframes shake    { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-6px)} 40%{transform:translateX(6px)} 60%{transform:translateX(-4px)} 80%{transform:translateX(4px)} }

    /* ── Stats / KPI filter bar ──────────────────────── */
    .stats-bar {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(clamp(90px, 18vw, 160px), 1fr));
      gap: clamp(6px, 1.2vw, 12px); margin-bottom: clamp(16px, 3vw, 28px);
    }
    .stat-card {
      background: var(--surface); border-radius: var(--radius);
      border: 1.5px solid var(--border);
      padding: clamp(8px, 1.5vw, 14px) clamp(10px, 1.8vw, 16px);
      text-align: center;
      cursor: pointer; transition: box-shadow .18s, transform .18s, border-color .18s;
      user-select: none;
    }
    .stat-card:hover { box-shadow: var(--shadow); transform: translateY(-1px); }
    .stat-card.active {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(14,165,233,.18), var(--shadow);
      transform: translateY(-1px);
    }

    .stat-card.active-success { border-color: var(--success); box-shadow: 0 0 0 3px rgba(34,197,94,.18), var(--shadow);  transform: translateY(-1px); }
    .stat-card.active-warn    { border-color: var(--warn);    box-shadow: 0 0 0 3px rgba(245,158,11,.18), var(--shadow);  transform: translateY(-1px); }

    /* ── History badge & popover ──────────────────────── */
    .history-wrap { position: relative; display: inline-flex; align-items: center; }
    .history-badge {
      display: inline-flex; align-items: center; justify-content: center;
      width: 17px; height: 17px; border-radius: 50%;

    /* ── Mode toggle ──────────────────────────────────── */
    .mode-toggle {

    .mode-btn.active.edit-mode-btn { color: var(--accent2); }
    .mode-btn.active.read-mode-btn { color: var(--success); }

    /* read-only: hide edit controls scoped to a host */
    .tl-host.read-only .edit-only { display: none !important; }
    .tl-host.read-only .event-card { cursor: default; }
    .tl-host.read-only .event-card:hover { transform: none; }

    /* ── Export menu ──────────────────────────────────── */
    .export-menu { position: relative; }
    .export-dropdown {
      position: absolute; right: 0; top: calc(100% + 6px);
      background: var(--surface); border: 1.5px solid var(--border);
      border-radius: 10px; box-shadow: var(--shadow-lg);

    .export-menu.open .export-dropdown { display: block; }
    .export-option {

    /* ── Page layout ──────────────────────────────────── */
    .main-container { max-width: 1100px; margin: 0 auto; padding: clamp(16px, 4vw, 36px) clamp(12px, 3vw, 20px) 80px; }

    /* ── Responsive ───────────────────────────────────── */

<script>
'use strict';

/* ════════════════════════════════════════════════════════
   Shared helpers
════════════════════════════════════════════════════════ */
const TODAY_ISO = new Date().toISOString().slice(0, 10);

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

function escHtml(str) {
  if (!str) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function fmtDate(iso) {
  if (!iso) return '—';
  const [y, m, d] = iso.split('-');
  return `${d}/${m}/${y}`;
}

function daysDiff(a, b) {
  if (!a) return null;
  return Math.round((new Date(b || TODAY_ISO) - new Date(a)) / 86400000);
}

function fmtDelta(days) {
  const base = 'inline-flex items-center gap-1 px-2 py-0.5 rounded-full font-bold tabular-nums';
  const sz   = 'style="font-size:var(--text-xs)"';
  if (days === null) return '';
  if (days === 0) return `<span class="${base} bg-slate-100 text-slate-500" ${sz}><i class="fas fa-equals"></i> À temps</span>`;
  if (days > 0)   return `<span class="${base} bg-red-100 text-red-700" ${sz}><i class="fas fa-clock"></i> +${days}j</span>`;
  return `<span class="${base} bg-green-100 text-green-700" ${sz}><i class="fas fa-bolt"></i> ${days}j</span>`;
}

function fmtRelative(isoStr) {
  const diff = Math.round((Date.now() - new Date(isoStr)) / 60000);
  if (diff < 1)  return 'à l\'instant';
  if (diff < 60) return `il y a ${diff} min`;
  const h = Math.round(diff / 60);
  if (h < 24)    return `il y a ${h}h`;
  const d = Math.round(h / 24);
  if (d < 30)    return `il y a ${d}j`;
  return `il y a ${Math.round(d / 30)} mois`;
}

const STATUS_LABELS = { statut1:'Non démarré', statut2:'En cours', statut3:'En révision', statut4:'Terminé' };
const STATUS_DOT    = { statut1:'s1', statut2:'s2', statut3:'s3', statut4:'s4' };
const STATUS_BG     = { statut1:'s1-bg', statut2:'s2-bg', statut3:'s3-bg', statut4:'s4-bg' };
const STATUS_LABELS_EXT = { ...STATUS_LABELS, retard:'En retard' };
const STATUS_DOT_EXT    = { ...STATUS_DOT, retard:'sr' };
const STATUS_BG_EXT     = { ...STATUS_BG, retard:'sr-bg' };
const DONE_STATUSES = new Set(['statut4']);

/* ════════════════════════════════════════════════════════
   Attachment helpers (shared, modal-scoped)
════════════════════════════════════════════════════════ */

/* In-progress list while the modal is open */
let _pendingAttachments = [];

function switchAttachTab(tab) {
  document.querySelectorAll('.attach-tab').forEach(t => t.classList.toggle('active', t.dataset.atab === tab));
  document.getElementById('attachPanelLink').classList.toggle('active', tab === 'link');
  document.getElementById('attachPanelFile').classList.toggle('active', tab === 'file');
}

function addAttachLink() {
  const raw   = document.getElementById('attachUrl').value.trim();
  const label = document.getElementById('attachUrlLabel').value.trim();
  if (!raw) { shake('attachUrl'); return; }
  let url = raw;
  if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
  _pendingAttachments.push({ type: 'link', url, label: label || url });
  document.getElementById('attachUrl').value = '';
  document.getElementById('attachUrlLabel').value = '';
  _renderPending();
}

function addAttachFiles(e) {
  const files = Array.from(e.target.files);
  const readers = files.map(file => new Promise(resolve => {
    const reader = new FileReader();
    reader.onload = ev => resolve({
      type: 'file',
      name: file.name,
      mime: file.type || 'application/octet-stream',
      size: file.size,
      data: ev.target.result,   /* base64 data-URL */
    });
    reader.readAsDataURL(file);
  }));
  Promise.all(readers).then(items => {
    _pendingAttachments.push(...items);
    _renderPending();
  });
  e.target.value = '';
}

function removePending(idx) {
  _pendingAttachments.splice(idx, 1);
  _renderPending();
}

function _renderPending() {
  const list = document.getElementById('attachPendingList');
  if (!list) return;
  list.innerHTML = _pendingAttachments.map((a, i) => `
    <div class="attach-pending-item">
      <i class="fas ${a.type === 'link' ? 'fa-link text-sky-500' : 'fa-paperclip text-slate-400'}"></i>
      <span title="${escHtml(a.type === 'link' ? a.url : a.name)}">${escHtml(a.type === 'link' ? (a.label || a.url) : a.name)}</span>
      ${a.size ? `<span style="color:var(--muted);flex-shrink:0">${_fmtSize(a.size)}</span>` : ''}
      <button onclick="removePending(${i})" title="Retirer"><i class="fas fa-times"></i></button>
    </div>`).join('');
}

function _fmtSize(bytes) {
  if (bytes < 1024)       return bytes + ' o';
  if (bytes < 1048576)    return (bytes / 1024).toFixed(1) + ' Ko';
  return (bytes / 1048576).toFixed(1) + ' Mo';
}

function _loadPending(attachments) {
  _pendingAttachments = attachments ? attachments.map(a => ({ ...a })) : [];
  _renderPending();
}

window._attachDownloadByName = function(dataUrl, name) {
  const a = document.createElement('a');
  a.href = dataUrl;
  a.download = name;
  a.click();
};

/* shared toast */
function toast(msg, type = '') {
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  const icon = type === 'success' ? 'fa-check-circle' : type === 'error' ? 'fa-exclamation-circle' : 'fa-info-circle';
  el.innerHTML = `<i class="fas ${icon}"></i> ${escHtml(msg)}`;
  document.getElementById('toastContainer').appendChild(el);
  setTimeout(() => el.remove(), 3000);
}

/* shared modal helpers */
function openModal(id)  { document.getElementById(id).classList.add('active'); }
function closeModal(id) { document.getElementById(id).classList.remove('active'); }

document.querySelectorAll('.modal-overlay').forEach(o =>
  o.addEventListener('click', e => { if (e.target === o) closeModal(o.id); })
);
document.addEventListener('keydown', e => {
  if (e.key === 'Escape')
    document.querySelectorAll('.modal-overlay.active').forEach(o => closeModal(o.id));
});
document.getElementById('eventModalClose').onclick  = () => closeModal('eventModal');
document.getElementById('eventModalCancel').onclick = () => closeModal('eventModal');
document.getElementById('subModalClose').onclick    = () => closeModal('subModal');
document.getElementById('subModalCancel').onclick   = () => closeModal('subModal');
document.getElementById('confirmCancel').onclick    = () => closeModal('confirmModal');

/* shared shake */
function shake(id) {
  const el = document.getElementById(id);
  el.style.borderColor = 'var(--danger)';
  el.style.animation = 'none';
  requestAnimationFrame(() => {
    el.style.animation = 'shake .4s ease';
    setTimeout(() => { el.style.animation = ''; el.style.borderColor = ''; }, 500);
  });
}

/* shared history-popover close */
document.addEventListener('click', () =>
  document.querySelectorAll('.history-popover.open').forEach(p => p.classList.remove('open'))
);

/* ════════════════════════════════════════════════════════
   IndexedDB — single store 'timelines'; one record per
   timeline keyed by dbStore name: { id, events: [...] }
════════════════════════════════════════════════════════ */
const DB_NAME    = 'spr_timeline';
const TL_STORE   = 'timelines';
let _dbReady = null;

function getDB() {
  if (_dbReady) return _dbReady;
  _dbReady = new Promise((resolve, reject) => {
    /* Open without a version so we never request lower than what the browser holds.
       onupgradeneeded fires only on first-ever open (v0→v1) or if the store is missing. */
    const probe = indexedDB.open(DB_NAME);
    probe.onsuccess = e => {
      const db      = e.target.result;
      const current = db.version;
      db.close();
      if (db.objectStoreNames.contains(TL_STORE)) {
        /* Store already exists — reopen at same version to use it */
        const req2 = indexedDB.open(DB_NAME, current);
        req2.onsuccess = e2 => resolve(e2.target.result);
        req2.onerror   = () => reject(req2.error);
      } else {
        /* Bump version to add the timelines store */
        const req2 = indexedDB.open(DB_NAME, current + 1);
        req2.onupgradeneeded = e2 => {
          e2.target.result.createObjectStore(TL_STORE, { keyPath: 'id' });
        };
        req2.onsuccess = e2 => resolve(e2.target.result);
        req2.onerror   = () => reject(req2.error);
      }
    };
    probe.onerror = () => reject(probe.error);
  });
  return _dbReady;
}

/* Load the events array for a timeline key. Returns [] if not found. */
function tlLoad(key) {
  return getDB().then(db => new Promise((res, rej) => {
    const req = db.transaction(TL_STORE, 'readonly').objectStore(TL_STORE).get(key);
    req.onsuccess = () => res(req.result ? req.result.events : []);
    req.onerror   = () => rej(req.error);
  }));
}

/* Persist the full events array for a timeline key. */
function tlSave(key, events) {
  return getDB().then(db => new Promise((res, rej) => {
    const req = db.transaction(TL_STORE, 'readwrite').objectStore(TL_STORE).put({ id: key, events });
    req.onsuccess = () => res();
    req.onerror   = () => rej(req.error);
  }));
}

/* Wipe all events for a timeline key. */
function tlClear(key) {
  return tlSave(key, []);
}

/* ════════════════════════════════════════════════════════
   Timeline class
════════════════════════════════════════════════════════ */
class Timeline {
  /**
   * @param {object} options
   * @param {HTMLElement|string} options.container  – target element or CSS selector
   * @param {string}  options.title                 – panel heading
   * @param {string}  options.dbStore               – IndexedDB store name (unique per timeline)
   * @param {Array}   [options.seedData]             – initial demo rows if store is empty
   * @param {string}  [options.initialMode]          – 'read' | 'edit'  (default 'read')
   * @param {boolean} [options.showStats]            – show stats / KPI filter bar (default true)
   * @param {boolean} [options.showHeader]           – show panel header with title/controls (default true)
   */
  constructor(options = {}) {
    const {
      container,
      title       = 'Timeline',
      dbStore     = 'events',
      seedData    = [],
      initialMode = 'read',
      showStats   = true,
      showHeader  = true,
    } = options;

    this.title      = title;
    this.store      = dbStore;
    this.seed       = seedData;
    this.showStats  = showStats;
    this.showHeader = showHeader;

    this.events  = [];
    this.filter  = 'all';
    this.sortKey = 'date_initiale';
    this.sortDir = 'asc';
    this.mode    = initialMode;

    this._editingEventId = null;
    this._editingSubEventId = null;
    this._editingSubId      = null;

    /* resolve container */
    this.host = typeof container === 'string'
      ? document.querySelector(container)
      : container;
    if (!this.host) throw new Error(`Timeline: container not found — "${container}"`);
    this.host.classList.add('tl-host');

    this._buildDOM();
    this._bindEvents();
  }

  /* ── DOM scaffold ─────────────────────────────────── */
  _buildDOM() {
    const id = this.store; /* use store name as namespace for DOM IDs */

    this.host.innerHTML = `
      <!-- panel header -->
      ${this.showHeader ? `<div class="tl-panel-header">`  : '<!--'}
        <div class="tl-panel-title">
          <i class="fas fa-stream" style="color:var(--accent)"></i>
          ${escHtml(this.title)}
        </div>
        <div class="tl-panel-actions">
          <div class="search-box">
            <i class="fas fa-search"></i>
            <input type="text" id="${id}-search" placeholder="Rechercher…" />
          </div>
          <!-- mode toggle -->
          <div class="mode-toggle">
            <button class="mode-btn read-mode-btn ${this.mode==='read'?'active':''}" data-mode="read">
              <i class="fas fa-eye"></i><span>Lecture</span>
            </button>
            <button class="mode-btn edit-mode-btn ${this.mode==='edit'?'active':''}" data-mode="edit">
              <i class="fas fa-pen-to-square"></i><span>Édition</span>
            </button>
          </div>
          <!-- export -->
          <div class="export-menu edit-only" id="${id}-exportMenu">
            <button class="btn btn-ghost btn-sm" data-action="toggleExport">
              <i class="fas fa-download"></i><span>Export</span>
            </button>
            <div class="export-dropdown">
              <div class="export-option" data-action="exportJSON"><i class="fas fa-file-code"></i> JSON</div>
              <div class="export-option" data-action="exportCSV"><i class="fas fa-file-csv"></i> CSV</div>
            </div>
          </div>
          <button class="btn btn-ghost btn-sm edit-only" data-action="importJSON" title="Importer JSON">
            <i class="fas fa-upload"></i>
          </button>
          <button class="btn btn-primary btn-sm edit-only" data-action="openEventModal">
            <i class="fas fa-plus"></i><span>Événement</span>
          </button>
        </div>
      ${this.showHeader ? `</div>` : '-->'}

      <!-- stats / KPI filters -->
      ${this.showStats ? `<div class="stats-bar" id="${id}-stats"></div>` : ''}

      <!-- timeline -->
      <div class="timeline-wrapper" id="${id}-wrapper"></div>
    `;

    this._applyMode(this.mode);
  }

  /* ── Event binding ────────────────────────────────── */
  _bindEvents() {
    const id = this.store;

    /* search */
    this.host.querySelector(`#${id}-search`).addEventListener('input', () => this._render());

    /* mode toggle */
    this.host.querySelectorAll('.mode-btn').forEach(btn =>
      btn.addEventListener('click', () => this._applyMode(btn.dataset.mode))
    );

    /* KPI cards as filters */
    this.host.addEventListener('click', e => {
      const card = e.target.closest('.stat-card[data-filter]');
      if (!card) return;
      const f = card.dataset.filter;
      this.filter = this.filter === f ? 'all' : f; /* toggle off if already active */
      this._renderStats();
      this._render();
    });

    /* sort select — delegated because element is re-created on each _render() */
    this.host.addEventListener('change', e => {
      if (e.target.id === `${id}-sortSelect`) {
        this.sortKey = e.target.value;
        this._render();
      }
    });

    /* toolbar actions (data-action) */
    this.host.addEventListener('click', e => {
      const btn = e.target.closest('[data-action]');
      if (!btn) return;
      const action = btn.dataset.action;
      if (action === 'toggleToolbar') {
        e.stopPropagation();
        this.host.querySelector(`#${id}-toolbarToggle`).classList.toggle('open');
        this.host.querySelector(`#${id}-toolbarControls`).classList.toggle('open');
      }
      if (action === 'toggleDir')    { e.stopPropagation(); this._toggleDir(); }
      if (action === 'expandAll')    this._expandAll(true);
      if (action === 'collapseAll')  this._expandAll(false);
      if (action === 'toggleExport') { e.stopPropagation(); this.host.querySelector(`#${id}-exportMenu`).classList.toggle('open'); }
      if (action === 'exportJSON')   this._exportJSON();
      if (action === 'exportCSV')    this._exportCSV();
      if (action === 'importJSON')   this._triggerImport();
      if (action === 'openEventModal') this._openEventModal();
    });

    /* close export dropdown on outside click */
    document.addEventListener('click', () =>
      this.host.querySelector(`#${id}-exportMenu`)?.classList.remove('open')
    );

    /* delegated: event-card & sub-item actions rendered dynamically */
    this.host.addEventListener('click', e => {
      const t = e.target.closest('[data-ev-action]');
      if (!t) return;
      const { evAction, evId, subId } = t.dataset;
      if (evAction === 'edit-event')   this._openEventModal(evId);
      if (evAction === 'del-event')    this._confirmDeleteEvent(evId);
      if (evAction === 'toggle-sub')   this._toggleSub(evId);
      if (evAction === 'open-sub')     this._openSubModal(evId);
      if (evAction === 'edit-sub')     this._openSubModal(evId, subId);
      if (evAction === 'del-sub')      this._confirmDeleteSub(evId, subId);
      if (evAction === 'history-pop')   { e.stopPropagation(); this._toggleHistoryPop(t.dataset.popId); }
      if (evAction === 'download-attach') { window._attachDownloadByName(t.dataset.attachData, t.dataset.attachName); }
    });

    /* hidden file input for import */
    const fileInput = document.getElementById('fileInput');
    fileInput.addEventListener('change', e => this._handleImport(e));

    /* shared modal save buttons — delegate to whichever instance opened them */
    document.getElementById('eventModalSave').onclick = () => this._saveEvent();
    document.getElementById('subModalSave').onclick   = () => this._saveSub();
  }

  /* ── Mode ─────────────────────────────────────────── */
  _applyMode(mode) {
    this.mode = mode;
    if (mode === 'read') {
      this.host.classList.add('read-only');
    } else {
      this.host.classList.remove('read-only');
    }
    this.host.querySelectorAll('.mode-btn').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.mode === mode);
    });
  }

  /* ── Render ───────────────────────────────────────── */
  _render() {
    const id   = this.store;
    const q    = (this.host.querySelector(`#${id}-search`).value || '').toLowerCase();
    const wrap = this.host.querySelector(`#${id}-wrapper`);

    let list = [...this.events];

    if (this.filter === 'overdue') list = list.filter(e => daysDiff(e.date_initiale, e.date_reelle) > 0);
    if (this.filter === 'ontime')  list = list.filter(e => { const d = daysDiff(e.date_initiale, e.date_reelle); return d !== null && d <= 0; });
    if (this.filter === 'no-real') list = list.filter(e => !e.date_reelle);

    if (q) list = list.filter(e =>
      e.label.toLowerCase().includes(q) ||
      (e.note || '').toLowerCase().includes(q) ||
      (e.sub || []).some(s => s.label.toLowerCase().includes(q))
    );

    list = this._sort(list, this.sortKey);

    if (list.length === 0) {
      wrap.innerHTML = `<div class="empty-state">
        <i class="fas fa-calendar-times"></i>
        <p>Aucun événement trouvé.</p>
        <button class="btn btn-primary edit-only" data-action="openEventModal"><i class="fas fa-plus"></i> Ajouter un événement</button>
      </div>`;
      this._renderStats();
      return;
    }

    const toolbarHtml = `
      <div class="cap-toolbar">
        <button class="toolbar-toggle" id="${id}-toolbarToggle" data-action="toggleToolbar">
          <i class="fas fa-sliders-h" style="font-size:.6rem"></i> Trier
          <i class="fas fa-chevron-down t-chevron" style="font-size:.55rem"></i>
        </button>
        <div class="toolbar-controls" id="${id}-toolbarControls">
          <button class="btn btn-ghost btn-sm" data-action="toggleDir" id="${id}-dirBtn" title="Ordre">
            <i class="fas fa-arrow-down-1-9"></i>
          </button>
          <button class="btn btn-ghost btn-sm" data-action="expandAll" title="Tout déplier"><i class="fas fa-expand-alt"></i></button>
          <button class="btn btn-ghost btn-sm" data-action="collapseAll" title="Tout replier"><i class="fas fa-compress-alt"></i></button>
          <select class="form-control" id="${id}-sortSelect" style="width:auto;padding:3px 6px;font-size:var(--text-xs)">
            <option value="date_initiale">Date initiale</option>
            <option value="date_reelle">Date réelle</option>
            <option value="label">Nom</option>
          </select>
        </div>
      </div>`;
    const capDebut = `<div class="timeline-cap cap-start"><span class="cap-label">Début</span>${toolbarHtml}</div>`;
    const capFin   = `<div class="timeline-cap cap-end"><span class="cap-label">Fin</span></div>`;
    const [capTop, capBot] = this.sortDir === 'asc' ? [capDebut, capFin] : [capFin, capDebut];
    wrap.innerHTML = capTop + list.map(ev => this._renderEvent(ev)).join('') + capBot;
    /* restore select value after re-render */
    const sel = this.host.querySelector(`#${id}-sortSelect`);
    if (sel) sel.value = this.sortKey;
    this._renderStats();
  }

  _sort(list, key) {
    if (key === 'label') {
      const sorted = [...list].sort((a, b) => a.label.localeCompare(b.label));
      return this.sortDir === 'desc' ? sorted.reverse() : sorted;
    }
    const dated   = list.filter(e => e[key]);
    const undated = list.filter(e => !e[key]);
    dated.sort((a, b) => a[key].localeCompare(b[key]));
    if (this.sortDir === 'desc') { dated.reverse(); undated.reverse(); return [...undated, ...dated]; }
    return [...dated, ...undated];
  }

  _renderEvent(ev) {
    const delta    = fmtDelta(daysDiff(ev.date_initiale, ev.date_reelle));
    const odClass  = this._overdueClass(ev);
    const effSt    = this._effectiveStatus(ev);
    const subs     = ev.sub || [];
    const noteHtml = ev.note
      ? `<div class="px-5 pb-4 pt-2.5 text-slate-500 leading-relaxed border-t border-slate-100" style="font-size:var(--text-sm)">${escHtml(ev.note)}</div>`
      : '';
    const subItems = subs.map(s => this._renderSub(ev.id, s)).join('');

    /* date chip helpers */
    const chipBase = 'inline-flex items-center gap-1 px-2 py-0.5 rounded-full font-semibold font-mono tabular-nums';
    const chipInit = `${chipBase} bg-sky-100 text-sky-700`;
    const chipLate = `${chipBase} bg-red-100 text-red-700`;
    const chipEarly= `${chipBase} bg-green-100 text-green-700`;

    const subSection = subs.length > 0 ? `
      <div class="sub-toggle" id="${this.store}-toggle-${ev.id}"
           data-ev-action="toggle-sub" data-ev-id="${ev.id}">
        <i class="fas fa-sitemap" style="color:var(--accent2)"></i>
        ${subs.length} sous-événement${subs.length > 1 ? 's' : ''}
        <span class="count-badge">${subs.filter(s=>s.status==='statut4').length}/${subs.length}</span>
        <i class="fas fa-chevron-down chevron"></i>
      </div>
      <div class="sub-list" id="${this.store}-sublist-${ev.id}">
        ${subItems}
        <div class="add-sub-row edit-only">
          <button class="btn btn-ghost btn-sm" data-ev-action="open-sub" data-ev-id="${ev.id}">
            <i class="fas fa-plus"></i> Sous-événement
          </button>
        </div>
      </div>
    ` : `
      <div class="sub-toggle" style="cursor:default;border-top:1px solid var(--border)">
        <i class="fas fa-sitemap" style="color:#e2e8f0"></i>
        <span class="opacity-50 text-xs">Aucun sous-événement</span>
        <button class="btn btn-ghost btn-sm edit-only" style="margin-left:auto"
                data-ev-action="open-sub" data-ev-id="${ev.id}">
          <i class="fas fa-plus"></i>
        </button>
      </div>
    `;

    return `
    <div class="event-card ${odClass}" id="${this.store}-event-${ev.id}" data-id="${ev.id}">
      ${subs.length > 0 ? `<span class="event-dot has-subs" data-ev-action="toggle-sub" data-ev-id="${ev.id}"></span>` : ''}
      <div class="event-header">
        <div class="event-header-left">
          <div class="font-bold tracking-tight leading-snug text-slate-900 mb-2 break-words" style="font-size:var(--text-base)">${escHtml(ev.label)}</div>
          <div class="flex flex-wrap gap-1.5 items-center">
            <span class="${chipInit}"><i class="fas fa-calendar"></i>${fmtDate(ev.date_initiale)}</span>
            ${ev.date_reelle
              ? `<span class="${daysDiff(ev.date_initiale, ev.date_reelle) > 0 ? chipLate : chipEarly}"><i class="fas fa-calendar-check"></i>${fmtDate(ev.date_reelle)}${this._historyBadgeHtml(ev, ev.id)}</span>`
              : this._isLate(ev) ? `<span class="${chipLate}" title="Date du jour"><i class="fas fa-calendar-day"></i>Aujourd'hui</span>` : ''}
            ${delta}
            ${effSt === 'retard' ? `<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full font-bold bg-red-100 text-red-800" style="font-size:var(--text-xs)"><i class="fas fa-triangle-exclamation"></i> En retard</span>` : ''}
          </div>
        </div>
        <div class="event-actions edit-only">
          <button class="btn btn-ghost btn-sm btn-icon" title="Modifier"
                  data-ev-action="edit-event" data-ev-id="${ev.id}">
            <i class="fas fa-pen" style="color:var(--accent)"></i>
          </button>
          <button class="btn btn-ghost btn-sm btn-icon" title="Supprimer"
                  data-ev-action="del-event" data-ev-id="${ev.id}">
            <i class="fas fa-trash" style="color:var(--danger)"></i>
          </button>
        </div>
      </div>
      ${noteHtml}
      ${subSection}
    </div>`;
  }

  _renderSub(evId, s) {
    const delta = fmtDelta(daysDiff(s.date_initiale, s.date_reelle));
    const effS  = this._effectiveStatus(s);

    const badgeCls = {
      statut1: 'bg-slate-100 text-slate-500',
      statut2: 'bg-amber-100 text-amber-800',
      statut3: 'bg-sky-100 text-sky-700',
      statut4: 'bg-green-100 text-green-700',
      retard:  'bg-red-100 text-red-800',
    };
    const chipBase  = 'inline-flex items-center gap-1 px-1.5 py-0.5 rounded-full font-semibold font-mono tabular-nums';
    const chipInit  = `${chipBase} bg-sky-100 text-sky-700`;
    const chipLate  = `${chipBase} bg-red-100 text-red-700`;
    const chipEarly = `${chipBase} bg-green-100 text-green-700`;

    return `
    <div class="sub-item ${STATUS_DOT_EXT[effS] || 's1'}" id="${this.store}-sub-${evId}-${s.id}">
      <div class="sub-info">
        <div class="font-semibold text-slate-700 leading-snug break-words" style="font-size:var(--text-sm)">${escHtml(s.label)}</div>
        <div class="flex flex-wrap gap-1.5 mt-1 items-center">
          <span class="${chipInit}" style="font-size:var(--text-xs)"><i class="fas fa-calendar"></i>${fmtDate(s.date_initiale)}</span>
          ${s.date_reelle
            ? `<span class="${daysDiff(s.date_initiale, s.date_reelle) > 0 ? chipLate : chipEarly}" style="font-size:var(--text-xs)"><i class="fas fa-calendar-check"></i>${fmtDate(s.date_reelle)}${this._historyBadgeHtml(s, evId + '-' + s.id)}</span>`
            : this._isLate(s) ? `<span class="${chipLate}" style="font-size:var(--text-xs)" title="Date du jour"><i class="fas fa-calendar-day"></i>Aujourd'hui</span>` : ''}
          ${delta}
          <span class="inline-flex items-center px-1.5 py-0.5 rounded-full font-bold tracking-wide ${badgeCls[effS] || badgeCls.statut1}" style="font-size:var(--text-xs)">${STATUS_LABELS_EXT[effS] || s.status}</span>
        </div>
        ${s.note ? `<div class="mt-1 text-slate-400 text-pretty" style="font-size:var(--text-xs)">${escHtml(s.note)}</div>` : ''}
        ${this._attachChipsHtml(s.attachments)}
      </div>
      <div class="sub-actions edit-only">
        <button class="btn btn-ghost btn-sm btn-icon" title="Modifier"
                data-ev-action="edit-sub" data-ev-id="${evId}" data-sub-id="${s.id}">
          <i class="fas fa-pen" style="color:var(--accent2)"></i>
        </button>
        <button class="btn btn-ghost btn-sm btn-icon" title="Supprimer"
                data-ev-action="del-sub" data-ev-id="${evId}" data-sub-id="${s.id}">
          <i class="fas fa-trash" style="color:var(--danger)"></i>
        </button>
      </div>
    </div>`;
  }

  _attachChipsHtml(attachments) {
    if (!attachments || attachments.length === 0) return '';
    const chips = attachments.map(a => {
      if (a.type === 'link') {
        return `<a class="attach-chip" href="${escHtml(a.url)}" target="_blank" rel="noopener" title="${escHtml(a.url)}">
          <i class="fas fa-link"></i><span>${escHtml(a.label || a.url)}</span>
        </a>`;
      }
      /* file: store data in a data attribute, handled by delegated listener */
      const nameEsc = escHtml(a.name);
      return `<span class="attach-chip" data-ev-action="download-attach"
          data-attach-name="${nameEsc}" data-attach-data="${escHtml(a.data)}" title="${nameEsc}">
        <i class="fas fa-paperclip"></i><span>${nameEsc}</span>
        ${a.size ? `<span style="opacity:.6;font-size:.65rem;flex-shrink:0">${_fmtSize(a.size)}</span>` : ''}
      </span>`;
    }).join('');
    return `<div class="attach-list">${chips}</div>`;
  }

  _renderStats() {
    if (!this.showStats) return;
    const id      = this.store;
    const total   = this.events.length;
    const overdue = this.events.filter(e => this._isLate(e)).length;
    const ontime  = this.events.filter(e => { const d = daysDiff(e.date_initiale, e.date_reelle); return d !== null && d <= 0 && !this._isLate(e); }).length;
    const subs    = this.events.reduce((a, e) => a + (e.sub || []).length, 0);
    const el = this.host.querySelector(`#${id}-stats`);
    if (!el) return;
    const f   = this.filter;
    const val = 'font-extrabold tracking-tighter leading-none';
    const lbl = 'mt-1 font-bold text-slate-400 uppercase tracking-widest';
    const sz  = 'font-size:clamp(1.3rem,3.5vw,1.8rem)';
    const szl = 'font-size:var(--text-xs)';
    const tip = ' title="Cliquer pour filtrer"';
    el.innerHTML = `
      <div class="stat-card ${f==='all'?'active':''}"           data-filter="all"${tip}>
        <div class="${val} text-sky-500"   style="${sz}">${total}</div>
        <div class="${lbl}" style="${szl}">Tous</div>
      </div>
      <div class="stat-card ${f==='overdue'?'active-danger':''}"  data-filter="overdue"${tip}>
        <div class="${val} text-red-500"   style="${sz}">${overdue}</div>
        <div class="${lbl}" style="${szl}">En retard</div>
      </div>
      <div class="stat-card ${f==='ontime'?'active-success':''}"  data-filter="ontime"${tip}>
        <div class="${val} text-green-500" style="${sz}">${ontime}</div>
        <div class="${lbl}" style="${szl}">À temps</div>
      </div>
      <div class="stat-card ${f==='no-real'?'active-warn':''}"    data-filter="no-real"${tip}>
        <div class="${val} text-amber-500" style="${sz}">${subs}</div>
        <div class="${lbl}" style="${szl}">Sans date</div>
      </div>
    `;
  }

  /* ── Status helpers ───────────────────────────────── */
  _isLate(obj) {
    if (DONE_STATUSES.has(obj.status)) return false;
    return daysDiff(obj.date_initiale, obj.date_reelle) > 0;
  }

  _effectiveStatus(obj) {
    if (!DONE_STATUSES.has(obj.status) && this._isLate(obj)) return 'retard';
    return obj.status || 'statut1';
  }

  _overdueClass(ev) {
    const d = daysDiff(ev.date_initiale, ev.date_reelle);
    if (d === null) return '';
    if (this._isLate(ev)) return 'overdue';
    if (d <= 0) return 'on-time';
    return '';
  }

  /* ── History badge ────────────────────────────────── */
  _historyBadgeHtml(obj, uid) {
    const hist = obj.date_reelle_history;
    if (!hist || hist.length === 0) return '';
    const popId = `${this.store}-hist-${uid}`;
    const entries = hist.map((h, i) => `
      <div class="history-entry">
        <span class="h-idx">${i + 1}</span>
        <span class="h-date">${fmtDate(h.date)}</span>
        <span class="h-when">${fmtRelative(h.changed_at)}</span>
      </div>`).join('');
    return `
      <span class="history-wrap">
        <span class="history-badge"
              data-ev-action="history-pop" data-pop-id="${popId}"
              title="${hist.length} modification(s)">${hist.length}</span>
        <div class="history-popover" id="${popId}">
          <h4><i class="fas fa-history"></i> Historique date réelle</h4>
          ${entries}
          <div class="history-entry" style="border-top:1px solid #f1f5f9;margin-top:4px;padding-top:6px">
            <span class="h-idx" style="background:var(--accent);color:#fff">${hist.length + 1}</span>
            <span class="h-date" style="color:var(--accent)">${fmtDate(obj.date_reelle)} <em style="font-weight:400;font-size:.7rem">(actuelle)</em></span>
          </div>
        </div>
      </span>`;
  }

  _toggleHistoryPop(popId) {
    const el = document.getElementById(popId);
    if (!el) return;
    const isOpen = el.classList.contains('open');
    document.querySelectorAll('.history-popover.open').forEach(p => p.classList.remove('open'));
    if (!isOpen) el.classList.add('open');
  }

  /* ── Sub toggle ───────────────────────────────────── */
  _toggleSub(evId) {
    const list   = this.host.querySelector(`#${this.store}-sublist-${evId}`);
    const toggle = this.host.querySelector(`#${this.store}-toggle-${evId}`);
    if (!list) return;
    list.classList.toggle('open');
    toggle?.classList.toggle('open');
  }

  _expandAll(open) {
    this.events.forEach(e => {
      const list   = this.host.querySelector(`#${this.store}-sublist-${e.id}`);
      const toggle = this.host.querySelector(`#${this.store}-toggle-${e.id}`);
      if (!list) return;
      list.classList.toggle('open', open);
      toggle?.classList.toggle('open', open);
    });
  }

  /* ── Sort direction toggle ────────────────────────── */
  _toggleDir() {
    this.sortDir = this.sortDir === 'asc' ? 'desc' : 'asc';
    const btn = this.host.querySelector(`#${this.store}-dirBtn`);
    btn.innerHTML = this.sortDir === 'asc'
      ? '<i class="fas fa-arrow-down-1-9"></i>'
      : '<i class="fas fa-arrow-up-9-1"></i>';
    this._render();
  }

  /* ── Event CRUD ───────────────────────────────────── */
  _openEventModal(id) {
    this._editingEventId = id || null;
    const ev = id ? this.events.find(e => e.id === id) : null;
    document.getElementById('eventModalTitle').textContent = ev ? 'Modifier l\'événement' : 'Nouvel événement';
    document.getElementById('evLabel').value    = ev?.label         ?? '';
    document.getElementById('evDateInit').value = ev?.date_initiale ?? '';
    document.getElementById('evDateReal').value = ev?.date_reelle   ?? '';
    document.getElementById('evStatus').value   = ev?.status        ?? 'statut1';
    document.getElementById('evNote').value     = ev?.note          ?? '';
    openModal('eventModal');
    setTimeout(() => document.getElementById('evLabel').focus(), 50);
  }

  async _saveEvent() {
    const label    = document.getElementById('evLabel').value.trim();
    const dateInit = document.getElementById('evDateInit').value;
    const dateReal = document.getElementById('evDateReal').value || null;
    const status   = document.getElementById('evStatus').value;
    const note     = document.getElementById('evNote').value.trim();

    if (!label)    { shake('evLabel');    return; }
    if (!dateInit) { shake('evDateInit'); return; }

    if (this._editingEventId) {
      const ev = this.events.find(e => e.id === this._editingEventId);
      if (dateReal !== ev.date_reelle) {
        if (!ev.date_reelle_history) ev.date_reelle_history = [];
        if (ev.date_reelle) ev.date_reelle_history.push({ date: ev.date_reelle, changed_at: new Date().toISOString() });
      }
      Object.assign(ev, { label, date_initiale: dateInit, date_reelle: dateReal, status, note });
      await tlSave(this.store, this.events);
      toast('Événement mis à jour', 'success');
    } else {
      const ev = { id: uid(), label, date_initiale: dateInit, date_reelle: dateReal, status, note, date_reelle_history: [], sub: [] };
      this.events.push(ev);
      await tlSave(this.store, this.events);
      toast('Événement créé', 'success');
    }
    closeModal('eventModal');
    this._render();
  }

  _confirmDeleteEvent(id) {
    const ev = this.events.find(e => e.id === id);
    document.getElementById('confirmMsg').textContent = `Supprimer "${ev.label}" et tous ses sous-événements ?`;
    document.getElementById('confirmOkBtn').onclick = () => this._deleteEvent(id);
    openModal('confirmModal');
  }

  async _deleteEvent(id) {
    this.events = this.events.filter(e => e.id !== id);
    await tlSave(this.store, this.events);
    closeModal('confirmModal');
    this._render();
    toast('Événement supprimé');
  }

  /* ── Sub CRUD ─────────────────────────────────────── */
  _openSubModal(evId, subId) {
    this._editingSubEventId = evId;
    this._editingSubId      = subId || null;
    const ev  = this.events.find(e => e.id === evId);
    const sub = subId ? (ev.sub || []).find(s => s.id === subId) : null;
    document.getElementById('subModalTitle').textContent = sub ? 'Modifier le sous-événement' : 'Nouveau sous-événement';
    document.getElementById('subLabel').value    = sub?.label         ?? '';
    document.getElementById('subDateInit').value = sub?.date_initiale ?? '';
    document.getElementById('subDateReal').value = sub?.date_reelle   ?? '';
    document.getElementById('subStatus').value   = sub?.status        ?? 'statut1';
    document.getElementById('subNote').value     = sub?.note          ?? '';
    _loadPending(sub?.attachments ?? []);
    switchAttachTab('link');
    openModal('subModal');
    setTimeout(() => document.getElementById('subLabel').focus(), 50);
  }

  async _saveSub() {
    const label    = document.getElementById('subLabel').value.trim();
    const dateInit = document.getElementById('subDateInit').value;
    const dateReal = document.getElementById('subDateReal').value || null;
    const status   = document.getElementById('subStatus').value;
    const note     = document.getElementById('subNote').value.trim();

    if (!label)    { shake('subLabel');    return; }
    if (!dateInit) { shake('subDateInit'); return; }

    const ev = this.events.find(e => e.id === this._editingSubEventId);
    if (!ev.sub) ev.sub = [];

    const attachments = [..._pendingAttachments];

    if (this._editingSubId) {
      const sub = ev.sub.find(s => s.id === this._editingSubId);
      if (dateReal !== sub.date_reelle) {
        if (!sub.date_reelle_history) sub.date_reelle_history = [];
        if (sub.date_reelle) sub.date_reelle_history.push({ date: sub.date_reelle, changed_at: new Date().toISOString() });
      }
      Object.assign(sub, { label, date_initiale: dateInit, date_reelle: dateReal, status, note, attachments });
      toast('Sous-événement mis à jour', 'success');
    } else {
      ev.sub.push({ id: uid(), label, date_initiale: dateInit, date_reelle: dateReal, status, note, attachments, date_reelle_history: [] });
      toast('Sous-événement créé', 'success');
    }
    await tlSave(this.store, this.events);
    closeModal('subModal');
    const wasOpen = this.host.querySelector(`#${this.store}-sublist-${ev.id}`)?.classList.contains('open');
    this._render();
    if (wasOpen) this._toggleSub(ev.id);
  }

  _confirmDeleteSub(evId, subId) {
    const ev  = this.events.find(e => e.id === evId);
    const sub = (ev.sub || []).find(s => s.id === subId);
    document.getElementById('confirmMsg').textContent = `Supprimer "${sub.label}" ?`;
    document.getElementById('confirmOkBtn').onclick = () => this._deleteSub(evId, subId);
    openModal('confirmModal');
  }

  async _deleteSub(evId, subId) {
    const ev = this.events.find(e => e.id === evId);
    ev.sub   = (ev.sub || []).filter(s => s.id !== subId);
    await tlSave(this.store, this.events);
    closeModal('confirmModal');
    this._render();
    toast('Sous-événement supprimé');
  }

  /* ── Export / Import ──────────────────────────────── */
  _exportJSON() {
    const blob = new Blob([JSON.stringify(this.events, null, 2)], { type: 'application/json' });
    this._download(blob, `${this.store}.json`);
  }

  _exportCSV() {
    const rows = [['id','label','date_initiale','date_reelle','note','sub_id','sub_label','sub_date_initiale','sub_date_reelle','sub_status','sub_note']];
    this.events.forEach(ev => {
      if (!ev.sub || ev.sub.length === 0) {
        rows.push([ev.id, ev.label, ev.date_initiale||'', ev.date_reelle||'', ev.note||'', '', '', '', '', '', '']);
      } else {
        ev.sub.forEach(s =>
          rows.push([ev.id, ev.label, ev.date_initiale||'', ev.date_reelle||'', ev.note||'', s.id, s.label, s.date_initiale||'', s.date_reelle||'', s.status||'', s.note||''])
        );
      }
    });
    const csv  = rows.map(r => r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
    this._download(new Blob([csv], { type: 'text/csv' }), `${this.store}.csv`);
  }

  _download(blob, name) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    a.click();
    URL.revokeObjectURL(a.href);
  }

  _triggerImport() {
    const fi = document.getElementById('fileInput');
    fi._targetTimeline = this;
    fi.value = '';
    fi.click();
  }

  async _handleImport(e) {
    const tl = document.getElementById('fileInput')._targetTimeline;
    if (!tl || tl !== this) return;
    const file = e.target.files[0];
    if (!file) return;
    try {
      const data = JSON.parse(await file.text());
      if (!Array.isArray(data)) throw new Error('Format invalide');
      this.events = data.map(ev => ({ ...ev, id: ev.id || uid(), sub: ev.sub || [] }));
      await tlSave(this.store, this.events);
      this._render();
      toast(`${data.length} événement(s) importé(s)`, 'success');
    } catch (err) {
      toast('Erreur d\'importation: ' + err.message, 'error');
    }
  }

  /* ── Public: init from DB ─────────────────────────── */
  async init() {
    let stored = await tlLoad(this.store);
    if (stored.length === 0 && this.seed.length > 0) {
      stored = this.seed;
      await tlSave(this.store, stored);
    }
    this.events = stored;
    this._applyMode(this.mode);
    this._render();
    return this;
  }

  /* ── Public: data access ──────────────────────────── */
  getEvents() { return this.events; }
}
