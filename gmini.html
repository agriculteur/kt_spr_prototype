    <script>
        /* ==========================================
           1. CORE DATA & INITIALIZATION
        ========================================== */
        let projects = [];
        let currentUser = "visiteur@autorite.qc.ca";

        function initData() {
            const stored = localStorage.getItem('app_projects');
            if (!stored) {
                // Génération de 50 projets basés sur le schéma complexe
                projects = Array.from({ length: 50 }, (_, i) => ({
                    code: 4000 + i,
                    titre: i === 0 ? "Réforme de la Transparence Algorithmique" : `Projet Réglementaire ${4000 + i}`,
                    type_projet: i % 2 === 0 ? "Modification Réglementaire" : "Nouvelle Norme",
                    reglement: `REG-202${i}-X`,
                    statut: ["en cours", "terminé", "en attente", "clos"][i % 4],
                    priorite: ["faible", "moyen", "élevé"][i % 3],
                    loi: ["Loi sur les valeurs mobilières", "Loi sur la protection du consommateur"],
                    niveau_risque: ["élevé", "moyen", "faible"][i % 3],
                    juridiction_principale: "Québec",
                    direction_principale: "Direction de l'Innovation",
                    direction_responsable: ["Encadrement des Marchés", "Affaires Juridiques"],
                    Ressources_associees: [
                        { photo: "https://i.pravatar.cc/150?u=1", prenom: "Marc", nom: "Durocher", email: "chef@autorite.qc.ca", role: "Chef de projet" },
                        { photo: "https://i.pravatar.cc/150?u=2", prenom: "Elisa", nom: "Poirier", email: "legal@autorite.qc.ca", role: "Conseillère Juridique" }
                    ],
                    Comite_ACVM: [{ prenom: "Jean", nom: "Smith", email: "j.smith@acvm.ca", institution: "OSC" }],
                    groupe_de_travail: [{ prenom: "Sarah", nom: "Tremblay", email: "s.t@amf.ca", institution: "AMF" }],
                    description: "Ce projet définit les critères de transparence pour les systèmes d'IA utilisés dans le secteur financier.",
                    enjeux: "Protection des secrets commerciaux vs transparence publique.",
                    discussion: "Faut-il exiger le code source ou une simple documentation technique ?",
                    jalons: [{ date_initiale: "2024-06-12", description: "Consultation Publique", statut: "En préparation" }],
                    impact_système: i % 3 === 0,
                    impact_description: "Mise à jour requise du registre des émetteurs.",
                    documents: [{ titre: "Lignes Directrices.pdf", type_document: "PDF", lien: "#", chargement_date: "2024-01-15", chargement_par: "chef@autorite.qc.ca" }]
                }));
                localStorage.setItem('app_projects', JSON.stringify(projects));
            } else {
                projects = JSON.parse(stored);
            }
        }

        /* ==========================================
           2. NAVIGATION & UI LOGIC
        ========================================== */
        function navigate(view, params = null) {
            const container = document.getElementById('app-container');
            
            // UI Active State
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('active-nav'));
            const activeBtn = document.getElementById(`nav-${view}`);
            if (activeBtn) activeBtn.classList.add('active-nav');

            container.classList.remove('page-transition');
            void container.offsetWidth; // Trigger reflow
            container.classList.add('page-transition');

            if (view === 'dashboard') container.innerHTML = renderDashboard();
            if (view === 'projects') container.innerHTML = renderProjectList();
            if (view === 'detail') container.innerHTML = renderProjectDetail(params);
            if (view === 'edit') container.innerHTML = renderEditForm(params);
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('sidebar-closed');
        }

        function showToast(msg, type = 'success') {
            const id = Date.now();
            const bg = type === 'success' ? 'bg-emerald-500' : 'bg-rose-500';
            const icon = type === 'success' ? 'fa-check-circle' : 'fa-exclamation-triangle';
            
            const toast = document.createElement('div');
            toast.className = `${bg} text-white px-6 py-4 rounded-2xl shadow-xl flex items-center space-x-3 transform transition-all duration-300 animate-bounce-in`;
            toast.innerHTML = `<i class="fas ${icon} text-lg"></i><span class="text-sm font-bold">${msg}</span>`;
            
            document.getElementById('toast-container').appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        function switchUser() {
            currentUser = document.getElementById('userSelector').value;
            const name = currentUser.split('@')[0];
            document.getElementById('user-name').innerText = name.charAt(0).toUpperCase() + name.slice(1);
            document.getElementById('user-initials').innerText = name.charAt(0).toUpperCase();
            showToast(`Connecté en tant que ${name.toUpperCase()}`);
            navigate('projects');
        }

        /* ==========================================
           3. VIEW RENDERING (USER FRIENDLY)
        ========================================== */
        function renderDashboard() {
            return `
                <div class="mb-10">
                    <h1 class="text-4xl font-extrabold text-slate-900 tracking-tight">Tableau de Bord</h1>
                    <p class="text-slate-500 mt-2 font-medium">Suivi en temps réel des projets réglementaires de la SMVD.</p>
                </div>
                
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-10">
                    ${kpiCard("Actifs", projects.filter(p=>p.statut==='en cours').length, "fa-rocket", "bg-sky-500")}
                    ${kpiCard("Risques Élevés", projects.filter(p=>p.niveau_risque==='élevé').length, "fa-triangle-exclamation", "bg-rose-500")}
                    ${kpiCard("Réglements", [...new Set(projects.map(p=>p.reglement))].length, "fa-gavel", "bg-amber-500")}
                    ${kpiCard("Impact SI", projects.filter(p=>p.impact_système).length, "fa-microchip", "bg-indigo-500")}
                </div>

                <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                    <div class="lg:col-span-2 bg-white rounded-3xl p-8 border border-slate-200 shadow-sm">
                        <h3 class="font-bold text-lg mb-6 flex items-center"><i class="fas fa-history mr-3 text-slate-400"></i>Activités récentes</h3>
                        <div class="space-y-6">
                            ${projects.slice(0, 4).map(p => `
                                <div class="flex items-start space-x-4">
                                    <div class="w-10 h-10 rounded-xl bg-slate-100 flex items-center justify-center text-slate-500 font-bold text-xs">${p.code}</div>
                                    <div class="flex-1">
                                        <p class="text-sm font-bold text-slate-800">${p.titre}</p>
                                        <p class="text-xs text-slate-500">Mise à jour du statut vers : <span class="text-sky-600 font-bold uppercase">${p.statut}</span></p>
                                    </div>
                                    <span class="text-[10px] font-black text-slate-300">IL Y A 2H</span>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                    <div class="bg-gradient-to-br from-slate-900 to-slate-800 rounded-3xl p-8 text-white shadow-xl shadow-slate-200">
                        <h3 class="font-bold text-lg mb-6">Répartition selon les priorités</h3>
                        <div class="space-y-4">
                            ${['élevé', 'moyen', 'faible'].map(pr => `
                                <div>
                                    <div class="flex justify-between text-xs font-bold uppercase mb-2">
                                        <span>${pr}</span>
                                        <span>${Math.round((projects.filter(p=>p.priorite===pr).length / projects.length)*100)}%</span>
                                    </div>
                                    <div class="h-2 bg-slate-700 rounded-full overflow-hidden">
                                        <div class="h-full ${pr==='élevé' ? 'bg-rose-500' : 'bg-sky-500'}" style="width: ${(projects.filter(p=>p.priorite===pr).length / projects.length)*100}%"></div>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        function kpiCard(label, val, icon, color) {
            return `
                <div class="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm hover:shadow-md transition-shadow">
                    <div class="flex items-center justify-between mb-4">
                        <div class="w-12 h-12 rounded-2xl ${color} bg-opacity-10 flex items-center justify-center">
                            <i class="fas ${icon} ${color.replace('bg-', 'text-')} text-xl"></i>
                        </div>
                        <span class="text-2xl font-black text-slate-900">${val}</span>
                    </div>
                    <p class="text-xs font-black text-slate-400 uppercase tracking-widest">${label}</p>
                </div>`;
        }

        function renderProjectList() {
            return `
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-8">
                    <div>
                        <h1 class="text-3xl font-black text-slate-900">Projets & Lois</h1>
                        <p class="text-slate-500 font-medium">Gérez le catalogue des initiatives réglementaires.</p>
                    </div>
                    <div class="flex space-x-2">
                        <button class="bg-sky-500 text-white px-6 py-3 rounded-2xl font-bold text-sm shadow-lg shadow-sky-500/20 hover:bg-sky-600 transition">
                            <i class="fas fa-plus mr-2"></i>Nouveau Projet
                        </button>
                    </div>
                </div>

                <div id="projectGrid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">
                    ${projects.map(p => renderProjectCard(p)).join('')}
                </div>
            `;
        }

        function renderProjectCard(p) {
            const statusColors = {
                'en cours': 'bg-sky-100 text-sky-700',
                'terminé': 'bg-emerald-100 text-emerald-700',
                'en attente': 'bg-amber-100 text-amber-700',
                'clos': 'bg-slate-100 text-slate-500'
            };
            return `
                <div onclick="navigate('detail', ${p.code})" class="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm hover:shadow-xl hover:-translate-y-1 transition-all cursor-pointer group">
                    <div class="flex justify-between items-start mb-6">
                        <div class="flex flex-col">
                            <span class="text-[10px] font-black text-slate-400 uppercase tracking-tighter">Code #${p.code}</span>
                            <span class="text-xs font-bold text-sky-500">${p.reglement}</span>
                        </div>
                        <span class="px-3 py-1 rounded-full text-[10px] font-black uppercase ${statusColors[p.statut]}">${p.statut}</span>
                    </div>
                    <h3 class="text-lg font-bold text-slate-800 group-hover:text-sky-600 transition mb-3 line-clamp-1">${p.titre}</h3>
                    <p class="text-xs text-slate-500 font-medium line-clamp-2 mb-6 h-8">${p.description}</p>
                    
                    <div class="flex items-center justify-between pt-5 border-t border-slate-50">
                        <div class="flex -space-x-3">
                            ${p.Ressources_associees.slice(0, 3).map(r => `<img src="${r.photo}" class="w-8 h-8 rounded-full border-2 border-white shadow-sm" title="${r.prenom}">`).join('')}
                        </div>
                        <span class="text-[10px] font-black uppercase ${p.priorite==='élevé' ? 'text-rose-500' : 'text-slate-400'}"><i class="fas fa-flag mr-1"></i>${p.priorite}</span>
                    </div>
                </div>`;
        }

        function renderProjectDetail(code) {
            const p = projects.find(x => x.code === code);
            const isEditor = p.Ressources_associees.some(r => r.email === currentUser);

            return `
                <div class="flex flex-col lg:flex-row justify-between gap-6 mb-8">
                    <div class="flex items-center space-x-6">
                        <button onclick="navigate('projects')" class="w-12 h-12 rounded-2xl bg-white border border-slate-200 flex items-center justify-center text-slate-400 hover:text-sky-500 transition-colors shadow-sm">
                            <i class="fas fa-chevron-left"></i>
                        </button>
                        <div>
                            <div class="flex items-center space-x-3 mb-1">
                                <span class="text-xs font-black text-sky-500 uppercase tracking-widest">${p.reglement}</span>
                                <span class="w-1.5 h-1.5 rounded-full bg-slate-300"></span>
                                <span class="text-xs font-bold text-slate-400 uppercase">${p.type_projet}</span>
                            </div>
                            <h1 class="text-3xl font-black text-slate-900">${p.titre}</h1>
                        </div>
                    </div>
                    <div class="flex items-center space-x-3">
                        ${isEditor ? `
                            <button onclick="navigate('edit', ${p.code})" class="flex-1 lg:flex-none bg-slate-900 text-white px-8 py-3 rounded-2xl font-bold text-sm shadow-lg hover:bg-slate-800 transition">
                                <i class="fas fa-pen-nib mr-2"></i>Éditer
                            </button>
                        ` : `
                            <div class="bg-amber-50 border border-amber-200 px-4 py-2 rounded-xl flex items-center text-amber-700 text-xs font-bold">
                                <i class="fas fa-lock mr-2"></i> Lecture seule pour ce profil
                            </div>
                        `}
                    </div>
                </div>

                <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
                    <div class="lg:col-span-8 space-y-8">
                        <div class="bg-white rounded-3xl shadow-sm border border-slate-200 p-2 flex space-x-2">
                            <button onclick="switchTab('context')" class="tab-btn active-tab flex-1 py-3 text-sm font-black uppercase rounded-2xl transition">Contexte</button>
                            <button onclick="switchTab('legal')" class="tab-btn flex-1 py-3 text-sm font-black uppercase rounded-2xl transition">Légal & ACVM</button>
                            <button onclick="switchTab('team')" class="tab-btn flex-1 py-3 text-sm font-black uppercase rounded-2xl transition">Équipe</button>
                        </div>

                        <div id="tab-context" class="tab-content space-y-8 animate-fadeIn">
                            <div class="bg-white rounded-3xl p-8 border border-slate-200 shadow-sm">
                                <h3 class="font-black text-xs text-slate-400 uppercase tracking-widest mb-6">Résumé & Enjeux</h3>
                                <p class="text-slate-700 leading-relaxed mb-8 text-lg">${p.description}</p>
                                <div class="bg-slate-50 p-6 rounded-2xl border border-slate-100 flex items-start space-x-4">
                                    <div class="w-10 h-10 rounded-xl bg-amber-100 flex items-center justify-center text-amber-600">
                                        <i class="fas fa-lightbulb"></i>
                                    </div>
                                    <div>
                                        <p class="text-xs font-black text-slate-400 uppercase mb-1">Point de discussion</p>
                                        <p class="text-sm font-medium text-slate-700 italic">"${p.discussion}"</p>
                                    </div>
                                </div>
                            </div>

                            <div class="bg-white rounded-3xl p-8 border border-slate-200 shadow-sm">
                                <h3 class="font-black text-xs text-slate-400 uppercase tracking-widest mb-8">Chronologie des Jalons</h3>
                                <div class="relative space-y-8 before:absolute before:inset-0 before:ml-5 before:h-full before:w-0.5 before:bg-slate-100">
                                    ${p.jalons.map(j => `
                                        <div class="relative pl-12">
                                            <div class="absolute left-0 top-0 w-10 h-10 rounded-full bg-white border-4 border-sky-500 flex items-center justify-center shadow-sm">
                                                <i class="fas fa-check text-[10px] text-sky-500"></i>
                                            </div>
                                            <p class="text-[10px] font-black text-slate-400 uppercase mb-1">${j.date_initiale}</p>
                                            <p class="font-bold text-slate-800">${j.description}</p>
                                            <span class="inline-block mt-2 px-3 py-1 bg-sky-50 text-sky-600 text-[9px] font-black rounded-full uppercase italic">${j.statut}</span>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="lg:col-span-4 space-y-8">
                        <div class="bg-slate-900 rounded-3xl p-8 text-white shadow-2xl relative overflow-hidden group">
                            <div class="absolute -right-10 -top-10 w-40 h-40 bg-sky-500 rounded-full opacity-10 blur-3xl group-hover:scale-150 transition-transform duration-700"></div>
                            <h3 class="font-black text-xs text-sky-400 uppercase tracking-widest mb-6">Gouvernance</h3>
                            <div class="space-y-6">
                                <div><p class="text-[10px] text-slate-500 font-bold uppercase mb-1">Juridiction Principale</p><p class="text-sm font-bold">${p.juridiction_principale}</p></div>
                                <div><p class="text-[10px] text-slate-500 font-bold uppercase mb-1">Direction Responsable</p><p class="text-sm font-bold">${p.direction_principale}</p></div>
                                <div>
                                    <p class="text-[10px] text-slate-500 font-bold uppercase mb-3">Lois de référence</p>
                                    <div class="flex flex-wrap gap-2">
                                        ${p.loi.map(l => `<span class="bg-slate-800 border border-slate-700 px-3 py-1.5 rounded-xl text-[10px] font-medium">${l}</span>`).join('')}
                                    </div>
                                </div>
                            </div>
                        </div>

                        ${p.impact_système ? `
                            <div class="bg-rose-50 border border-rose-100 rounded-3xl p-6">
                                <div class="flex items-center space-x-3 text-rose-600 mb-3">
                                    <i class="fas fa-microchip text-xl"></i>
                                    <h4 class="font-black text-xs uppercase tracking-widest">Impact Système</h4>
                                </div>
                                <p class="text-sm text-rose-900 leading-relaxed font-medium">${p.impact_description}</p>
                            </div>
                        ` : ''}

                        <div class="bg-white rounded-3xl p-8 border border-slate-200 shadow-sm">
                            <h3 class="font-black text-xs text-slate-400 uppercase tracking-widest mb-6">Documents Externes</h3>
                            <div class="space-y-3">
                                ${p.documents.map(d => `
                                    <div class="group flex items-center justify-between p-3 border border-slate-100 rounded-2xl hover:border-sky-300 hover:bg-sky-50 transition-all cursor-pointer">
                                        <div class="flex items-center space-x-3">
                                            <div class="w-10 h-10 rounded-xl bg-slate-50 group-hover:bg-white flex items-center justify-center text-slate-400 group-hover:text-sky-500 transition-colors">
                                                <i class="far fa-file-pdf text-lg"></i>
                                            </div>
                                            <div class="overflow-hidden">
                                                <p class="text-xs font-bold text-slate-700 truncate">${d.titre}</p>
                                                <p class="text-[9px] text-slate-400 font-bold uppercase">${d.chargement_date}</p>
                                            </div>
                                        </div>
                                        <i class="fas fa-cloud-download-alt text-slate-300 group-hover:text-sky-500"></i>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        /* Helpers UI */
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active-tab', 'bg-slate-900', 'text-white'));
            
            const content = document.getElementById(`tab-${tabId}`);
            if (content) content.classList.remove('hidden');
            
            event.currentTarget.classList.add('bg-slate-900', 'text-white');
        }

        function filterProjects() {
            const query = document.getElementById('globalSearch').value.toLowerCase();
            const grid = document.getElementById('projectGrid');
            if (!grid) return;
            
            const filtered = projects.filter(p => 
                p.titre.toLowerCase().includes(query) || 
                p.code.toString().includes(query) || 
                p.reglement.toLowerCase().includes(query)
            );
            
            grid.innerHTML = filtered.map(p => renderProjectCard(p)).join('');
        }

        /* Initialisation Automatique */
        document.addEventListener('DOMContentLoaded', () => {
            initData();
            navigate('dashboard');
        });
    </script>

    <style>
        .active-tab { background: #0f172a; color: white !important; }
        @keyframes bounce-in { 
            0% { transform: scale(0.9) translateY(10px); opacity: 0; }
            50% { transform: scale(1.05); }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }
        .animate-bounce-in { animation: bounce-in 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    </style>
</body>
</html>
